<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chipotle Nutrition Calculator - Free Calorie Counter &amp; Nutrition Facts Tool</title>
    <meta name="description" content="Calculate nutrition information for your favorite Chipotle meals with our free online tool. Select your ingredients to see calories, protein, carbs, fat, and other nutrition facts.">
    <link rel="canonical" href="https://chipotlenutrition.org/">
    <meta property="og:title" content="Chipotle Nutrition Calculator">
    <meta property="og:description" content="Calculate nutrition information for your favorite Chipotle meals with our free online tool.">
    <meta property="og:site_name" content="Chipotle Nutrition Calculator">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        chipotle: {
                            red: '#dc2626',
                            brown: '#8B4513',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2 text-gray-800 hover:text-gray-600 transition-colors" aria-label="Chipotle Nutrition Home" onclick="navigateTo('/'); return false;">
                <svg class="w-8 h-8" viewBox="0 0 32 32" fill="none">
                    <circle cx="16" cy="16" r="15" fill="#dc2626"/>
                    <path d="M8 16c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8-8-3.6-8-8z" fill="#fff" opacity="0.3"/>
                    <circle cx="16" cy="16" r="4" fill="#fff"/>
                </svg>
                <span class="font-bold text-lg">Chipotle Nutrition Calculator</span>
            </a>
            <a href="https://chipotlenutrition.org/Chipotle-Nutrition-Facts.pdf" target="_blank" rel="noopener" class="hidden md:flex items-center gap-2 text-gray-600 hover:text-gray-800 text-sm transition-colors" aria-label="View PDF Menu">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                <span>Chipotle nutrition facts paper</span>
            </a>
        </div>
    </header>

    <main id="app" class="flex-grow">
    </main>

    <footer class="bg-white border-t border-gray-200 mt-12">
        <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col md:flex-row items-center justify-between gap-4 text-sm text-gray-500">
            <span>Chipotle Nutrition &bull; &copy; 2025 All rights reserved</span>
            <div class="flex gap-4">
                <a href="/terms" onclick="navigateTo('/terms'); return false;" class="hover:text-gray-700 transition-colors">Terms of Service</a>
                <a href="/privacy" onclick="navigateTo('/privacy'); return false;" class="hover:text-gray-700 transition-colors">Privacy Policy</a>
            </div>
        </div>
    </footer>

    <div id="nutrition-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-gray-200 shadow-lg transform translate-y-full transition-transform duration-300 z-50" style="display:none;">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <span id="selected-count" class="text-sm text-gray-600">0 items selected</span>
                <button id="clear-all-btn" class="text-sm font-semibold text-red-500 hover:text-red-700 transition-colors" onclick="clearAllSelections()">Clear All</button>
            </div>
            <div class="flex gap-4 text-sm">
                <div class="flex flex-col items-center bg-orange-50 rounded-lg px-3 py-1.5 min-w-[60px]">
                    <span id="total-calories" class="font-bold text-orange-600">0</span>
                    <span class="text-xs text-gray-600">Calories</span>
                </div>
                <div class="flex flex-col items-center bg-blue-50 rounded-lg px-3 py-1.5 min-w-[60px]">
                    <span id="total-fat" class="font-bold text-blue-600">0g</span>
                    <span class="text-xs text-gray-600">Fat</span>
                </div>
                <div class="flex flex-col items-center bg-green-50 rounded-lg px-3 py-1.5 min-w-[60px]">
                    <span id="total-protein" class="font-bold text-green-600">0g</span>
                    <span class="text-xs text-gray-600">Protein</span>
                </div>
                <div class="flex flex-col items-center bg-purple-50 rounded-lg px-3 py-1.5 min-w-[60px]">
                    <span id="total-carbs" class="font-bold text-purple-600">0g</span>
                    <span class="text-xs text-gray-600">Carbs</span>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/nutrition-data.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
